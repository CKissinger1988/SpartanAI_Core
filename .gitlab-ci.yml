# .gitlab-ci.yml
# SENTINELAI Autonomous Build, Release, and Pages Pipeline
stages:
  - build
  - release
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# ... existing build_binaries and release_job ...

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r web_portal/public/* public/
  artifacts:
    paths:
      - public
  only:
    - main
