name: Build JarvisAI Supreme OS ISOs
on:
  push:
    tags: ['v*']
jobs:
  build-rhel-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RHEL/Alma Image
        run: |
          docker pull fedora:latest
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:latest /bin/bash -c "
            dnf install -y lorax wget
            wget -qO base.iso https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-boot.iso
            mkksiso --ks rhel_ai_os/jarvis_rhel_ai.ks base.iso JarvisAI_Supreme_RHEL_OS.iso
          "
      - name: Release RHEL ISO
        uses: softprops/action-gh-release@v1
        with:
          files: JarvisAI_Supreme_RHEL_OS.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu AI Image
        run: |
          sudo apt update && sudo apt install -y xorriso wget mtools
          wget -qO ubuntu-base.iso https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso
          mkdir -p isofiles
          xorriso -osirrox on -indev ubuntu-base.iso -extract / isofiles
          chmod +w -R isofiles
          cp ubuntu_ai_os/user-data isofiles/ncloud/user-data
          touch isofiles/ncloud/meta-data
          # Modify grub for autoinstall
          sed -i 's/---/ autoinstall ds=ncloud;s=\/cdrom\/ncloud\/ ---/g' isofiles/boot/grub/grub.cfg
          xorriso -as mkisofs -r -V "JarvisAI_Ubuntu" -o JarvisAI_Supreme_Ubuntu_OS.iso \
            -J -l -b boot/grub/i386-pc/eltorito_mgr.boot -c boot.catalog -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot -e boot/grub/efi.img -no-emul-boot isofiles
      - name: Release Ubuntu ISO
        uses: softprops/action-gh-release@v1
        with:
          files: JarvisAI_Supreme_Ubuntu_OS.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
