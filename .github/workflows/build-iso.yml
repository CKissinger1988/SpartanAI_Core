name: Build ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools curl git daemonize debootstrap syslinux grub-pc-bin grub-efi-amd64-bin
      - name: Build ISO
        run: |
          cd releases
          sudo bash build-iso.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: sentinelai_security_core-live-security
          path: releases/sentinelai_security_core-live-security.iso
