name: Build JarvisAI Supreme OS ISO
on:
  push:
    tags: ['v*'] # Triggers on any version tag
jobs:
  build-os-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Fedora Builder Container
        run: |
          docker pull fedora:latest
          # We use a Fedora container because 'lorax' and 'mkksiso' are native Red Hat ecosystem tools.
          # To bypass Red Hat developer subscription walls for automated cloud pipelines, 
          # we use AlmaLinux 9 (100% RHEL 9 binary compatible) as the base ISO.
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:latest /bin/bash -c "
            dnf install -y lorax wget
            echo 'Downloading RHEL-Compatible Universal Base ISO (AlmaLinux 9)...'
            wget -qO base.iso https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-boot.iso
            
            echo 'Injecting Deep Learning Kickstart...'
            mkksiso --ks rhel_ai_os/jarvis_rhel_ai.ks base.iso JarvisAI_Supreme_OS.iso
            
            echo 'ISO Compilation Complete.'
          "

      - name: Release Custom OS Artifact
        uses: softprops/action-gh-release@v1
        with:
          files: JarvisAI_Supreme_OS.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
