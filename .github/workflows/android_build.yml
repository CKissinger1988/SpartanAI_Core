name: Build NexusAI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          
      - name: Install Flet and Dependencies
        run: |
          pip install flet cryptography httpx zeroconf paho-mqtt pycryptodome argon2-cffi
          
      - name: Build APK
        run: |
          cd mobile
          flet build apk --project-name nexusai --description "NexusAI Mobile Hub"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexusai-mobile-apk
          path: mobile/build/apk/*.apk
