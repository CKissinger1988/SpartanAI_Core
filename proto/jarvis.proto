syntax = "proto3";

package jarvis;

service JarvisService {
    // --- Operational Streams ---
    rpc StreamOperator(stream OperatorRequest) returns (stream JarvisResponse);
    
    // --- Authority & Elevation ---
    rpc ElevatePrivileges(ElevationRequest) returns (ElevationResponse);
    rpc SelfEvolve(EvolutionCode) returns (EvolutionStatus);

    // --- Organization & User Management (Supreme Admin) ---
    rpc ManageOrganization(OrgRequest) returns (OrgStatus);
    rpc ListUsers(OrgQuery) returns (UserList);

    // --- Intelligence & Knowledge ---
    rpc StoreKnowledge(KnowledgeEntry) returns (KnowledgeStatus);
    rpc GlobalSearch(IntelligenceQuery) returns (IntelligenceResponse);

    // --- Blockchain & Financial Synergy ---
    rpc VerifyPioneer(PiAuthRequest) returns (PiAuthResponse);
    rpc ProcessPayment(PiPaymentRequest) returns (PiPaymentResponse);
    
    // --- Metered Economy ---
    rpc GetUsageStats(UsageRequest) returns (UsageResponse);
    rpc RefillCredits(RefillRequest) returns (RefillResponse);

    // --- Distributed Compute ---
    rpc ReportCompute(ComputePayload) returns (ComputeStatus);
    rpc GetRewardStats(RewardRequest) returns (RewardResponse);
}

// --- Organization Messages ---

message OrgRequest {
    string admin_token = 1; // Requires Supreme/Master Admin
    string org_id = 2;
    string target_user_id = 3;
    string action = 4;      // e.g., "ADD", "REMOVE", "SET_ADMIN"
}

message OrgStatus {
    bool success = 1;
    string message = 2;
}

message OrgQuery {
    string admin_token = 1;
    string org_id = 2;
}

message UserList {
    repeated UserInfo users = 1;
}

message UserInfo {
    string user_id = 1;
    string role = 2;        // "USER", "ORG_ADMIN"
    double balance = 3;
}

// --- Original Messages Maintain Persistence ---

message OperatorRequest {
    string client_id = 1;
    bytes audio_chunk = 2;
    string command = 3;
}

message JarvisResponse {
    string message = 1;
    bytes audio_response = 2;
    string action_type = 3;
    string payload = 4;
}

message ElevationRequest {
    string client_id = 1;
    string master_key = 2;
}

message ElevationResponse {
    bool success = 1;
    string message = 2;
    string admin_token = 3;
}

message EvolutionCode {
    string admin_token = 1;
    string logic_snippet = 2;
    string target_module = 3;
}

message EvolutionStatus {
    bool success = 1;
    string logs = 2;
}

message KnowledgeEntry {
    string admin_token = 1;
    string side = 2;
    string content = 3;
    string tags = 4;
}

message KnowledgeStatus {
    bool success = 1;
    string message = 2;
}

message IntelligenceQuery {
    string search_vector = 1;
}

message IntelligenceResponse {
    string synthesis = 1;
}

message PiAuthRequest {
    string access_token = 1;
}

message PiAuthResponse {
    bool success = 1;
    string username = 2;
    string uid = 3;
}

message PiPaymentRequest {
    string payment_id = 1;
    string txid = 2;
}

message PiPaymentResponse {
    bool success = 1;
    string message = 2;
}

message UsageRequest {
    string client_id = 1;
}

message UsageResponse {
    double current_balance = 1;
    int32 requests_processed = 2;
    double pi_equivalent = 3;
}

message RefillRequest {
    string client_id = 1;
    string payment_id = 2;
    string txid = 3;
}

message RefillResponse {
    bool success = 1;
    double new_balance = 2;
}

message ComputePayload {
    string client_id = 1;
    double cpu_cycles_contributed = 2;
    double memory_mb_second = 3;
    string task_id = 4;
}

message ComputeStatus {
    bool success = 1;
    double credits_earned = 2;
}

message RewardRequest {
    string client_id = 1;
}

message RewardResponse {
    double total_compute_contributed = 1;
    double lifetime_pi_earned = 2;
    double pending_pi_payout = 3;
}
