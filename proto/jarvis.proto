syntax = "proto3";

package jarvis;

service JarvisService {
    // Bi-directional streaming for voice/commands
    rpc StreamOperator(stream OperatorRequest) returns (stream JarvisResponse);
    
    // Elevate session to Master Admin
    rpc ElevatePrivileges(ElevationRequest) returns (ElevationResponse);

    // Adaptive Self-Evolution: Update Jarvis logic on the fly
    rpc SelfEvolve(EvolutionCode) returns (EvolutionStatus);

    // Symmetric Knowledge Core: Feed the brain
    rpc StoreKnowledge(KnowledgeEntry) returns (KnowledgeStatus);
}

message OperatorRequest {
    string client_id = 1;
    bytes audio_chunk = 2;
    string command = 3;
}

message JarvisResponse {
    string message = 1;
    bytes audio_response = 2;
    string action_type = 3;
    string payload = 4;
}

message ElevationRequest {
    string client_id = 1;
    string master_key = 2;
}

message ElevationResponse {
    bool success = 1;
    string message = 2;
    string admin_token = 3;
}

message EvolutionCode {
    string admin_token = 1;
    string logic_snippet = 2;
    string target_module = 3;
}

message EvolutionStatus {
    bool success = 1;
    string logs = 2;
}

message KnowledgeEntry {
    string admin_token = 1;
    string side = 2; // "LIGHT" (Good) or "SHADOW" (Bad)
    string content = 3;
    string tags = 4;
}

message KnowledgeStatus {
    bool success = 1;
    string message = 2;
}
