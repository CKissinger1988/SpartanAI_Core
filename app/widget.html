<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jarvis Supreme Dashboard</title>
    <style>
        :root { 
            --threat-color: #00FF00; 
            --bg-color: #050505;
            --accent: rgba(0, 255, 0, 0.15);
        }
        body {
            background: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            -webkit-app-region: drag;
            border: 2px solid var(--accent);
            color: var(--threat-color);
            font-family: 'Share Tech Mono', monospace;
        }
        #hud {
            position: absolute; top: 15px; left: 15px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.85); 
            padding: 12px; border-left: 2px solid var(--threat-color);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            pointer-events: none;
        }
        #pi-prompt {
            position: absolute; bottom: 90px;
            background: #1a0000; border: 1px solid #FF0000;
            color: #FF8888; padding: 8px 15px;
            font-size: 11px; display: none; cursor: pointer;
            -webkit-app-region: no-drag;
            letter-spacing: 1px;
        }
        #alien-head {
            width: 90px; height: 90px;
            fill: var(--threat-color);
            filter: drop-shadow(0 0 15px var(--threat-color));
            animation: breathe 5s infinite ease-in-out;
            cursor: pointer; -webkit-app-region: no-drag;
            transition: all 0.4s ease;
        }
        @keyframes breathe { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--threat-color)); opacity: 0.9; }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 50px var(--threat-color)); opacity: 1; }
        }
        #cmdInput {
            display: none; position: absolute; bottom: 40px;
            background: #000; border: 1px solid var(--threat-color);
            color: var(--threat-color); padding: 12px; width: 85%;
            font-family: 'Share Tech Mono', monospace; 
            box-shadow: 0 0 20px var(--threat-color);
            -webkit-app-region: no-drag;
        }
    </style>
</head>
<body>
    <div id="hud">
        STATUS: <span id="uplink">ACTIVE</span> | UPLINK: <span id="tx">0.0</span> MB/s<br>
        NEURAL BRIDGE: <span id="ingest">0</span> | TOKENS: <span id="tokens">0</span><br>
        ------------------------------------------<br>
        PAYOUT: <span id="payout">0.00</span> PI<br>
        PROFIT: <span id="profit">0.00</span> PI<br>
        RATE: <span id="rate">1:100</span> PI/TKN
    </div>
    <div id="pi-prompt" onclick="buyTokens()">[ ALERT: TOKEN DEPLETION - INITIATE PI BUY ]</div>
    <svg id="alien-head" viewBox="0 0 24 24">
        <path d="M12,2C8.14,2 5,5.14 5,9C5,13.67 8.35,17.44 12.75,18.57L12,22L15.25,18.57C19.65,17.44 23,13.67 23,9C23,5.14 19.86,2 16,2H12Z" />
    </svg>
    <input type="text" id="cmdInput" placeholder=">_ SUPREME ORCHESTRATION COMMAND" />
    <script>
        async function buyTokens() {
            await window.electronAPI.ipcRenderer.invoke('payment.pi.trigger');
        }

        setInterval(async () => {
            const vitals = await window.electronAPI.ipcRenderer.invoke('sys.vitals');
            document.getElementById('uplink').innerText = vitals.uplink;
            document.getElementById('tx').innerText = vitals.tx.toFixed(1);
            document.getElementById('ingest').innerText = vitals.ingestion.toLocaleString();
            document.getElementById('tokens').innerText = vitals.tokens.toLocaleString();
            document.getElementById('payout').innerText = vitals.payout.toFixed(2);
            document.getElementById('profit').innerText = vitals.profit.toFixed(2);
            document.getElementById('rate').innerText = vitals.exchangeRate;
            
            const prompt = document.getElementById('pi-prompt');
            prompt.style.display = vitals.tokens < 500 ? 'block' : 'none';
        }, 800);
        
        const head = document.getElementById('alien-head');
        const input = document.getElementById('cmdInput');
        head.addEventListener('click', () => { 
            input.style.display = 'block'; 
            input.focus();
            head.style.opacity = '0.3';
        });
        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.style.display = 'none'; input.value = '';
                head.style.opacity = '1';
                await window.electronAPI.ipcRenderer.invoke('ai.command', cmd);
            }
        });
    </script>
</body>
</html>
