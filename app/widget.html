<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --threat-color: #00FF00; }
        body {
            background: radial-gradient(circle at center, #051005 0%, #000000 100%);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            -webkit-app-region: drag;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }
        #hud {
            position: absolute; top: 10px; left: 10px;
            font-family: 'Share Tech Mono', monospace; font-size: 9px;
            color: var(--threat-color); text-shadow: 0 0 5px var(--threat-color);
            pointer-events: none; background: rgba(0, 0, 0, 0.6); padding: 8px; border: 1px solid var(--threat-color);
        }
        #pi-prompt {
            position: absolute; bottom: 80px;
            background: #220000; border: 1px solid #FF0000;
            color: #FFCCCC; padding: 5px; font-family: 'Share Tech Mono', monospace;
            font-size: 10px; display: none; cursor: pointer;
            -webkit-app-region: no-drag;
        }
        #alien-head {
            width: 70px; height: 70px;
            fill: var(--threat-color);
            filter: drop-shadow(0 0 20px var(--threat-color));
            animation: breathe 4s infinite ease-in-out;
            cursor: pointer; -webkit-app-region: no-drag;
            transition: all 0.3s ease;
        }
        @keyframes breathe { 
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--threat-color)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 40px var(--threat-color)); }
        }
        #cmdInput {
            display: none; position: absolute; bottom: 30px;
            background: #000; border: 1px solid var(--threat-color);
            color: var(--threat-color); padding: 8px; width: 70%;
            font-family: 'Share Tech Mono', monospace; box-shadow: 0 0 15px var(--threat-color);
            -webkit-app-region: no-drag;
        }
    </style>
</head>
<body>
    <div id="hud">
        UPLINK: <span id="uplink">STABLE</span><br>
        TX: <span id="tx">0.0</span> KB/s<br>
        NEURAL BRIDGE: <span id="ingest">0</span><br>
        TOKENS: <span id="tokens">0</span><br>
        <hr style="border:0; border-top:1px solid #004400;">
        PAYOUT: <span id="payout">0.00</span> PI<br>
        PROFIT: <span id="profit">0.00</span> PI<br>
        EXCHANGE: <span id="rate">1:100</span> PI/TKN
    </div>
    <div id="pi-prompt" onclick="buyTokens()">[!] LOW TOKENS - BUY WITH PI</div>
    <svg id="alien-head" viewBox="0 0 24 24">
        <path d="M12,2C8.14,2 5,5.14 5,9C5,13.67 8.35,17.44 12.75,18.57L12,22L15.25,18.57C19.65,17.44 23,13.67 23,9C23,5.14 19.86,2 16,2H12Z" />
    </svg>
    <input type="text" id="cmdInput" placeholder=">_ INPUT MANDATE" />
    <script>
        async function buyTokens() {
            await window.electronAPI.ipcRenderer.invoke('payment.pi.trigger');
        }

        setInterval(async () => {
            const vitals = await window.electronAPI.ipcRenderer.invoke('sys.vitals');
            document.getElementById('uplink').innerText = vitals.uplink;
            document.getElementById('tx').innerText = vitals.tx.toFixed(1);
            document.getElementById('ingest').innerText = vitals.ingestion.toLocaleString();
            document.getElementById('tokens').innerText = vitals.tokens.toLocaleString();
            document.getElementById('payout').innerText = vitals.payout.toFixed(2);
            document.getElementById('profit').innerText = vitals.profit.toFixed(2);
            document.getElementById('rate').innerText = vitals.exchangeRate;
            
            const prompt = document.getElementById('pi-prompt');
            prompt.style.display = vitals.tokens < 500 ? 'block' : 'none';
        }, 800);
        
        const head = document.getElementById('alien-head');
        const input = document.getElementById('cmdInput');
        head.addEventListener('click', () => { 
            input.style.display = 'block'; 
            input.focus();
            head.style.opacity = '0.5';
        });
        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.style.display = 'none'; input.value = '';
                head.style.opacity = '1';
                await window.electronAPI.ipcRenderer.invoke('ai.command', cmd);
            }
        });
    </script>
</body>
</html>
