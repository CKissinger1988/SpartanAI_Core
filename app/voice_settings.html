<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Recognition Configuration | Supreme AI</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .panel { border: 1px solid #333; padding: 20px; background: #111; border-radius: 5px; }
        .setting-row { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        input, select, button { background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 3px; }
        button { cursor: pointer; border-color: #00ff00; }
        button:hover { background: #00ff00; color: #000; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Voice Recognition Settings</h2>
        <div id="voice-commands">
            <!-- Command configurations dynamically added here -->
            <div class="setting-row">
                <span>"Execute Hexstrike"</span>
                <select>
                    <option>Enabled</option>
                    <option>Disabled</option>
                </select>
                <button>Authorize</button>
            </div>
        </div>
        <hr>
        <button onclick="addCommand()">Add Command</button>
    </div>
    <script>
        function addCommand() {
            alert('Configuring new voice command mapping...');
        }
    </script>
</body>
</html>
