<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisAI Authentication | Supreme Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --core-bg: #050505;
            --surface-bg: rgba(10, 10, 10, 0.8);
            --accent-blue: #00AAFF;
            --border-color: rgba(0, 170, 255, 0.2);
            --text-main: #E0E0E0;
            --glow-blue: 0 0 15px rgba(0, 170, 255, 0.3);
            --font-mono: 'Fira Code', monospace;
        }

        body {
            background-color: var(--core-bg);
            color: var(--text-main);
            font-family: var(--font-mono);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        .login-box {
            width: 350px;
            padding: 30px;
            border: 1px solid var(--border-color);
            background: var(--surface-bg);
            backdrop-filter: blur(15px);
            box-shadow: var(--glow-blue);
            position: relative;
        }

        .login-box::before { content: ''; position: absolute; top: -1px; left: -1px; width: 15px; height: 15px; border: 1.5px solid var(--accent-blue); border-right: none; border-bottom: none; }
        .login-box::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 15px; height: 15px; border: 1.5px solid var(--accent-blue); border-left: none; border-top: none; }

        h2 { color: var(--accent-blue); font-size: 1rem; text-align: center; margin-bottom: 25px; letter-spacing: 2px; }

        .input-group { margin-bottom: 15px; }
        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 10px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            outline: none;
        }
        input:focus { border-color: var(--accent-blue); }

        button {
            width: 100%;
            padding: 10px;
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            font-family: var(--font-mono);
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: var(--accent-blue); color: var(--core-bg); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>JARVIS // AUTHENTICATION</h2>
        <div class="input-group"><input type="text" placeholder="AGENT_ID"></div>
        <div class="input-group"><input type="password" placeholder="NEURAL_KEY"></div>
        <button onclick="window.location.href='/dashboard'">INITIATE_ACCESS</button>
    </div>
</body>
</html>
