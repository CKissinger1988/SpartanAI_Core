<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINELAI | Supreme Intelligence Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E8EDF2;
            --primary-blue: #00AAFF;
            --text-dark: #2C3E50;
            --text-secondary: #7F8C8D;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 15px 45px rgba(0, 100, 200, 0.1);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #E8EDF2 100%);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Robotic Noise Overlay */
        body::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 1;
        }

        .login-box {
            width: 400px;
            padding: 60px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow);
            border-radius: 40px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 35px;
            text-align: center;
            animation: slideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #34495E;
            text-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
        }

        .subtitle {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #D1D9E6;
            padding: 18px 25px;
            color: var(--text-dark);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            border-radius: 20px;
            transition: 0.4s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-blue);
            background: #fff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 20px;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            font-family: inherit;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.4s;
            box-shadow: 0 10px 25px rgba(0, 170, 255, 0.3);
            font-size: 0.85rem;
        }

        button:hover {
            background: #0088CC;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 170, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            font-size: 0.55rem;
            color: #BDC3C7;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div>
            <h1>SENTINELAI</h1>
            <div class="subtitle">Supreme Access Portal</div>
        </div>
        <div class="input-group">
            <input type="text" placeholder="OPERATOR_ID">
            <input type="password" placeholder="NEURAL_KEY">
        </div>
        <button onclick="window.location.href='/index.html'">INITIATE_UPLINK</button>
        <div class="footer">ENCRYPTED VIA APEXVAULT // JARVIS OS</div>
    </div>
</body>
</html>
