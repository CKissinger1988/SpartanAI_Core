<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINELAI // Infrastructure Dashboard</title>
    <style>
        :root {
            --bg-color: #050505;
            --primary-cyan: #00ffcc;
            --primary-red: #ff3333;
            --text-light: #e0e0e0;
            --text-secondary: #888;
            --glass-bg: rgba(10, 10, 12, 0.6);
            --border: 1px solid rgba(0, 255, 204, 0.4);
            --shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 30px;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
        }
        h1 { color: var(--primary-cyan); letter-spacing: 8px; text-transform: uppercase; }
    </style>
<style>.bg-animated{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:url(bg.webp) no-repeat center center fixed;background-size:cover;animation:panAndZoom 20s ease-in-out infinite alternate}@keyframes panAndZoom{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.1) translate(-2%,-2%)}}</style></head>
<body><div class="bg-animated"></div>
    <div class="glass-panel">
        <h1>SENTINELAI // DASHBOARD</h1>
    </div>
</body>
</html>
