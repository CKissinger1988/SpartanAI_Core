# JarvisAI Production-Grade Deployment Specification
# Optimized for E4-class instance / Spot pricing ($25/mo budget)
version: '3.8'

services:
  jarvis-core:
    image: gcr.io/${PROJECT_ID}/jarvis-supreme:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    environment:
      - NODE_ENV=production
      - SUPREME_SEED=${SUPREME_SEED}
      - BACKUP_SECRET=${BACKUP_SECRET}
    volumes:
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    networks:
      - sentinel-mesh

networks:
  sentinel-mesh:
    driver: bridge
