# NEXUS // AI - Automated Kali Preseed (Encrypted + Strict Security)
# Localization
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string nexus-ai
d-i netcfg/get_domain string local
d-i netcfg/hostname string nexus-ai

# User configuration (Root focused)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password nexusai
d-i passwd/root-password-again password nexusai

# Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string US/Eastern
d-i clock-setup/ntp boolean true

# Partitioning (LUKS Encryption - Requires Manual Password Entry)
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-crypto/cipher string aes-xts-plain64
d-i partman-crypto/keysize select 512
d-i partman-crypto/hash string sha512
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package selection (Full Tools + Minimal X11 + Anonymity)
tasksel tasksel/first multiselect standard, kali-linux-everything
d-i pkgsel/include string xorg openbox lightdm lightdm-gtk-greeter python3 python3-pip nodejs npm tor curl git sudo macchanger iptables systemd-resolved heimdall-flash android-sdk-platform-tools
d-i pkgsel/upgrade select full-upgrade

# Post-installation integration
d-i preseed/late_command string \
    mkdir -p /target/opt/nexus-ai; \
    cp -r /cdrom/opt/nexus-ai/* /target/opt/nexus-ai/; \
    in-target chmod +x /opt/nexus-ai/scripts/setup_root.sh; \
    in-target /opt/nexus-ai/scripts/setup_root.sh;

# Finish installation
d-i finish-install/reboot_in_progress note
