<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisAI | Secure Key Provisioning & Account Genesis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --core-bg: #050505;
            --surface-bg: rgba(10, 10, 10, 0.95);
            --accent-blue: #00AAFF;
            --accent-purple: #BB86FC;
            --accent-green: #00FF00;
            --accent-red: #FF0000;
            --border-color: rgba(0, 170, 255, 0.2);
            --text-main: #E0E0E0;
            --font-mono: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--core-bg); 
            color: var(--text-main); 
            font-family: var(--font-mono); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at center, #111 0%, #050505 100%),
                linear-gradient(rgba(0, 170, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 170, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .genesis-container {
            width: 500px;
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 170, 255, 0.1);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .genesis-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .genesis-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-blue);
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
            margin-bottom: 5px;
        }

        .genesis-subtitle {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.55rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
        }

        .key-type-badge {
            font-size: 0.5rem;
            background: rgba(187, 134, 252, 0.1);
            color: var(--accent-purple);
            padding: 2px 6px;
            border: 1px solid rgba(187, 134, 252, 0.2);
            float: right;
        }

        .genesis-btn {
            width: 100%;
            padding: 15px;
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            font-family: var(--font-mono);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .genesis-btn:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 20px var(--accent-blue);
        }

        .security-note {
            margin-top: 20px;
            font-size: 0.55rem;
            color: #555;
            line-height: 1.5;
            text-align: center;
        }

        .scrolling-msg {
            height: 20px;
            font-size: 0.55rem;
            color: var(--accent-green);
            overflow: hidden;
            margin-top: 20px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="genesis-container">
        <div class="genesis-header">
            <div class="genesis-logo">JARVIS // GENESIS</div>
            <div class="genesis-subtitle">Secure Account Provisioning & Key Vault</div>
        </div>

        <form id="genesis-form" onsubmit="finalizeGenesis(event)">
            <!-- IDENTITY PROVISIONING -->
            <div class="input-group">
                <label>Agent Handle / Alias</label>
                <input type="text" id="agent-alias" placeholder="Enter tactical designation..." required>
            </div>

            <!-- API KEY DEFINITIONS -->
            <div class="input-group">
                <label>Supreme Central API Key <span class="key-type-badge">RSA 4096</span></label>
                <input type="password" id="central-api-key" placeholder="••••••••••••••••" required>
            </div>

            <div class="input-group">
                <label>Pi Network Wallet Seed <span class="key-type-badge">PRIVATE</span></label>
                <input type="password" id="pi-wallet-seed" placeholder="24 word phrase or encrypted hash...">
            </div>

            <div class="input-group">
                <label>RemoteADB Sovereignty Key <span class="key-type-badge">SYMMETRIC</span></label>
                <input type="password" id="adb-sovereign-key" placeholder="Local node access key...">
            </div>

            <div class="input-group">
                <label>Apple iCloud / Keychain Bridge <span class="key-type-badge">ENCRYPTED</span></label>
                <input type="password" id="apple-bridge-key" placeholder="iCloud session token or bridge key...">
            </div>

            <div class="input-group">
                <label>Ghost Desktop Bridge Port</label>
                <input type="number" id="bridge-port" value="4242">
            </div>

            <button type="submit" class="genesis-btn">Finalize Genesis Sequence</button>
        </form>

        <div class="scrolling-msg" id="genesis-status">[*] SECURE_ENCLAVE_READY: AWAITING INPUT</div>

        <div class="security-note">
            ALL KEYS ARE LOCALLY ENCRYPTED BEFORE TRANSMISSION.<br>
            JARVIS NEVER STORES PLAINTEXT SECRETS. ABSOLUTE OPSEC ENFORCED.
        </div>
    </div>

    <script>
        function finalizeGenesis(e) {
            e.preventDefault();
            const status = document.getElementById('genesis-status');
            status.innerText = "[*] INITIALIZING CRYPTOGRAPHIC HANDSHAKE...";
            status.style.color = "var(--accent-purple)";

            // Store credentials in localStorage (Simulated Secure Enclave)
            const keys = {
                alias: document.getElementById('agent-alias').value,
                centralKey: document.getElementById('central-api-key').value,
                piSeed: document.getElementById('pi-wallet-seed').value,
                adbKey: document.getElementById('adb-sovereign-key').value,
                port: document.getElementById('bridge-port').value
            };

            localStorage.setItem('JARVIS_VAULT', JSON.stringify(keys));
            localStorage.setItem('JARVIS_PROVISIONED', 'true');

            setTimeout(() => {
                status.innerText = "[+] GENESIS COMPLETE. REDIRECTING TO COMMAND CORE...";
                status.style.color = "var(--accent-green)";
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 2000);
        }

        // Automatic Status Rotation
        const msgs = [
            "[*] SECURE_ENCLAVE_READY: AWAITING INPUT",
            "[*] AES-256-GCM HARDWARE ACCELERATION ACTIVE",
            "[*] ZERO-KNOWLEDGE PROOF PROTOCOLS ENGAGED",
            "[*] MONITORING FOR KEYLOGGING VECTORS"
        ];
        let msgIdx = 0;
        setInterval(() => {
            if(!document.getElementById('genesis-status').innerText.includes("COMPLETE")) {
                msgIdx = (msgIdx + 1) % msgs.length;
                document.getElementById('genesis-status').innerText = msgs[msgIdx];
            }
        }, 4000);
    </script>
</body>
</html>
