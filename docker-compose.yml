# JarvisAI Deployment Specification
version: '3.8'

services:
  nexus-portal:
    build:
      context: .
      dockerfile: Dockerfile.web_portal
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
